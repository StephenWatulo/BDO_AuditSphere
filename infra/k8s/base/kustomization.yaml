apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auditsphere

commonLabels:
  app.kubernetes.io/part-of: auditsphere
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - web-deployment.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - migrate-job.yaml

images:
  - name: ghcr.io/bdo-ea/auditsphere-api
    newTag: latest
  - name: ghcr.io/bdo-ea/auditsphere-web
    newTag: latest
