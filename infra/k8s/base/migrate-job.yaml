# One-shot migration Job. Runs `prisma migrate deploy` with the API image and
# exits. Jobs are immutable, so delete the previous one before re-applying:
#   kubectl -n auditsphere delete job auditsphere-migrate --ignore-not-found
#   kubectl apply -k infra/k8s/overlays/production
#   kubectl -n auditsphere wait --for=condition=complete job/auditsphere-migrate --timeout=300s
# The deploy workflow (.github/workflows/deploy.yml) does exactly this before
# rolling the Deployments.
apiVersion: batch/v1
kind: Job
metadata:
  name: auditsphere-migrate
  labels:
    app.kubernetes.io/name: auditsphere-migrate
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auditsphere-migrate
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/bdo-ea/auditsphere-api
          imagePullPolicy: IfNotPresent
          env:
            - name: MIGRATE_ONLY
              value: "true"
          envFrom:
            - configMapRef:
                name: auditsphere-config
            - secretRef:
                name: auditsphere-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
