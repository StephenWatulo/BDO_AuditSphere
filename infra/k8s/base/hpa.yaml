apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auditsphere-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auditsphere-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auditsphere-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auditsphere-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
