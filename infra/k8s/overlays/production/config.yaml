apiVersion: v1
kind: ConfigMap
metadata:
  name: auditsphere-config
data:
  API_BASE_URL: https://auditsphere.bdo-ea.com
  WEB_BASE_URL: https://auditsphere.bdo-ea.com
  CORS_ORIGINS: https://auditsphere.bdo-ea.com
  ENTRA_REDIRECT_URI: https://auditsphere.bdo-ea.com/api/v1/auth/entra/callback
  S3_ENDPOINT: https://s3.af-south-1.amazonaws.com
  S3_REGION: af-south-1
  S3_BUCKET: auditsphere-documents-prod
  # Enable only after BDO approves the provider, data location and DPA.
  AI_ENABLED: "false"
  # Upload completion fails closed until this service returns a clean result.
  MALWARE_SCAN_REQUIRED: "true"
  CLAMAV_HOST: clamav.security.svc.cluster.local
  CLAMAV_PORT: "3310"
  SMTP_FROM: BDO AuditSphere <no-reply@bdo-ea.com>
