# BDO AuditSphere - local stack.
#
# Run from the repository root so the root .env is picked up:
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d --build
#
# Services
#   postgres    PostgreSQL 16                      localhost:5432
#   minio       S3-compatible object storage       API localhost:9000, console localhost:9001
#   minio-init  one-shot: creates the bucket
#   mailpit     SMTP sink with web UI              SMTP localhost:1025, UI localhost:8025
#   api         NestJS API (runs migrations)       localhost:4000
#   worker      same image with --worker
#   web         Next.js                            localhost:3000

name: auditsphere

x-api-env: &api-env
  NODE_ENV: production
  API_PORT: "4000"
  API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-auditsphere}:${POSTGRES_PASSWORD:-auditsphere}@postgres:5432/${POSTGRES_DB:-auditsphere}?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
  ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
  ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:4000/api/v1/auth/entra/callback}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-auditsphere-documents}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_FORCE_PATH_STYLE: "true"
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o}
  AI_ENABLED: ${AI_ENABLED:-false}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ${SMTP_FROM:-BDO AuditSphere <no-reply@auditsphere.local>}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditsphere}
      POSTGRES_DB: ${POSTGRES_DB:-auditsphere}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditsphere} -d ${POSTGRES_DB:-auditsphere}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-auditsphere-documents}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        (mc mb --ignore-existing local/$$S3_BUCKET) &&
        mc version enable local/$$S3_BUCKET &&
        echo bucket $$S3_BUCKET ready
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: ${API_IMAGE:-ghcr.io/bdo-ea/auditsphere-api:local}
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  worker:
    image: ${API_IMAGE:-ghcr.io/bdo-ea/auditsphere-api:local}
    command: ["--worker"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    image: ${WEB_IMAGE:-ghcr.io/bdo-ea/auditsphere-web:local}
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
