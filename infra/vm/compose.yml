name: auditsphere-live

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-api-environment: &api-environment
  NODE_ENV: production
  API_PORT: "4000"
  API_BASE_URL: https://${DOMAIN}
  WEB_BASE_URL: https://${DOMAIN}
  CORS_ORIGINS: https://${DOMAIN}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 12h
  COOKIE_SECURE: "true"
  MFA_ENFORCEMENT: "all"
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  MALWARE_SCAN_REQUIRED: "true"
  MALWARE_SCANNER: "clamav"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  CLAMAV_TIMEOUT_MS: "120000"
  AI_ENABLED: "false"
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ""
  AI_MODEL: ${AI_MODEL:-gpt-4o}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
  ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
  ENTRA_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/entra/callback
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-BDO AuditSphere <no-reply@auditsphere.local>}
  RUN_JOBS: "false"
  LOG_LEVEL: info

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc version enable "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        echo "private versioned bucket ready"
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 60
      start_period: 10m
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  api:
    image: auditsphere-api:${RELEASE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/ready"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  worker:
    image: auditsphere-api:${RELEASE_TAG}
    command: ["--worker"]
    restart: unless-stopped
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
      RUN_JOBS: "true"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  web:
    image: auditsphere-web:${RELEASE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/sign-in"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 45s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  demo-seed:
    profiles: ["tools"]
    image: auditsphere-api:${RELEASE_TAG}
    entrypoint: ["pnpm", "--filter", "@auditsphere/db", "exec", "tsx", "prisma/seed.ts", "--demo"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
    name: auditsphere-postgres-data
  minio-data:
    name: auditsphere-minio-data
  clamav-data:
    name: auditsphere-clamav-data
  caddy-data:
    name: auditsphere-caddy-data
  caddy-config:
    name: auditsphere-caddy-config
