packages:
  - "apps/*"
  - "packages/*"

overrides:
  deepmerge-ts: 8.0.0
  "exceljs>uuid": 11.1.1
  multer: 2.3.0
  postcss: 8.5.26

# pnpm 11 blocks dependency build scripts unless explicitly approved. The
# project remains pinned to pnpm 9, which safely ignores this compatibility map.
allowBuilds:
  "@embedded-postgres/linux-x64": true
  "@node-rs/argon2": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
